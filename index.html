<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>365 Manhãs com Deus</title>
<meta name="description" content="Devocional diário completo, com plano de leitura da Bíblia em 365 dias, jogos bíblicos e gerador de cartões — 100% offline.">
<meta name="theme-color" content="#8D4E2A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="Logo APP.png">
<link rel="stylesheet" href="tailwind.css">
<style>
:root{
  --bg:#FDFBF7; --text:#3E2723; --accent:#8D4E2A; --btn:#A67C52; --btn-soft:#D9B99B; --card:#FFFFFF;
}
*{ -webkit-tap-highlight-color: transparent; }
html,body{ background:var(--bg); color:var(--text); min-height:100%; }
body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
.font-display{ font-family: Georgia, "Times New Roman", serif; }
.card{ background:var(--card); border-radius:1rem; }
.bg-accent{ background-color:var(--accent) !important; }
.text-accent{ color:var(--accent) !important; }
.bg-btn{ background-color:var(--btn) !important; }
.bg-btn-soft{ background-color:var(--btn-soft) !important; }
.bible-text{ font-family: Georgia, "Times New Roman", serif; }
.safe-bottom{ padding-bottom: env(safe-area-inset-bottom, 0); }
.fade-in{ animation: fadeIn .18s ease-out; }
@keyframes fadeIn{ from{ opacity:0; transform: translateY(4px); } to{ opacity:1; transform:none; } }

#appHeader{ position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--btn-soft); }
#appNav{ position:sticky; bottom:0; z-index:20; background:var(--card); border-top:1px solid var(--btn-soft); }
.navBtn{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; font-size:11px; flex:1; }
#audioBar{ position:sticky; bottom:64px; z-index:19; background:var(--card); border-top:1px solid var(--btn-soft); }
#audioProgressTrack{ background:var(--btn-soft); }
#audioProgress{ background:var(--accent); }

.dark body{ }
</style>
</head>
<body class="min-h-screen">

<header id="appHeader" class="safe-bottom">
  <div class="max-w-md mx-auto px-4 py-3 flex items-center gap-2">
    <button id="backBtn" onclick="goBack()" class="hidden text-lg px-1 active:opacity-60" aria-label="Voltar">←</button>
    <h1 id="screenTitle" class="font-display font-bold text-lg flex-1 truncate">365 Manhãs com Deus</h1>
    <div class="flex items-center gap-1 text-xs font-semibold">
      <button id="langPt" onclick="setLang('pt')" class="px-2 py-1 rounded-full bg-btn-soft">PT</button>
      <button id="langEn" onclick="setLang('en')" class="px-2 py-1 rounded-full opacity-60">EN</button>
    </div>
  </div>
</header>

<main class="max-w-md mx-auto px-4 pt-4 pb-8 w-full"></main>

<div id="audioBar" class="hidden safe-bottom">
  <div class="max-w-md mx-auto px-4 py-2 flex items-center gap-3">
    <button onclick="audioPlay()" class="text-lg active:scale-90" aria-label="Tocar/Pausar">▶️</button>
    <button onclick="audioPause()" class="text-lg active:scale-90" aria-label="Pausar">⏸️</button>
    <button onclick="audioStop()" class="text-lg active:scale-90" aria-label="Parar">⏹️</button>
    <div class="flex-1 min-w-0">
      <div id="audioLabel" class="text-xs font-semibold truncate mb-1"></div>
      <div id="audioProgressTrack" class="h-1.5 rounded-full overflow-hidden">
        <div id="audioProgress" class="h-full" style="width:0%"></div>
      </div>
    </div>
    <button onclick="cycleSpeed()" id="audioSpeed" class="text-xs font-bold bg-btn-soft rounded-full px-2 py-1">1.0x</button>
  </div>
</div>

<nav id="appNav" class="safe-bottom">
  <div class="max-w-md mx-auto flex">
    <button class="navBtn" data-nav="home" onclick="showScreen('home')"><span>🏠</span><span>Hoje</span></button>
    <button class="navBtn" data-nav="temas" onclick="showScreen('temas')"><span>🔍</span><span>Temas</span></button>
    <button class="navBtn" data-nav="pedido" onclick="showScreen('pedido')"><span>🙏</span><span>Orar</span></button>
    <button class="navBtn" data-nav="jogos" onclick="showScreen('jogos')"><span>🎮</span><span>Jogos</span></button>
    <button class="navBtn" data-nav="mais" onclick="showScreen('mais')"><span>☰</span><span>Mais</span></button>
  </div>
</nav>

<script src="vendor/qrcode.js"></script>
<script src="corretor.js"></script>
<script src="devocional.js"></script>
<script src="cards4k.js"></script>
<script src="app.js"></script>
</body>
</html>
